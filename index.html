<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Genie — Free ACT Revision by Topic</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>
<!-- ═══════════ TOP BAR ═══════════ -->
<div class="topbar">
  <div class="logo">ACT<span>Genie</span></div>
  <nav>
    <button class="active" data-view="home">🏠 Home</button>
    <button data-view="math">📐 Math</button>
    <button data-view="english">📝 English</button>
    <button data-view="reading">📖 Reading</button>
    <button data-view="science">🔬 Science</button>
  </nav>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search topics…" oninput="doSearch()">
  </div>
</div>
<!-- ═══════════ MAIN ═══════════ -->
<main id="mainContent"></main>

  <script src="app.js"></script>
</body>
</html>
