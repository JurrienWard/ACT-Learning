<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Genie — Free ACT Revision by Topic</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f5f6f8;
  --text: #1a1a2e;
  --text2: #4a4a6a;
  --accent: #2563eb;
  --accent2: #3b82f6;
  --green: #059669;
  --amber: #d97706;
  --purple: #7c3aed;
  --rose: #e11d48;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --radius: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg2); color: var(--text); line-height:1.6;
}
/* ── NAV ───────────────────── */
.topbar{
  background:var(--bg); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
  padding:0 1.5rem; display:flex; align-items:center; height:60px;
  box-shadow: var(--shadow);
}
.topbar .logo{
  font-weight:800; font-size:1.25rem; color:var(--text);
  margin-right:2rem; white-space:nowrap;
}
.topbar .logo span{color:var(--accent)}
.topbar nav{display:flex; gap:.25rem; overflow-x:auto; flex:1}
.topbar nav button{
  background:none; border:none; padding:.5rem 1.1rem; font-size:.9rem;
  font-weight:600; cursor:pointer; border-radius:8px; white-space:nowrap;
  color:var(--text2); transition: all .15s;
}
.topbar nav button:hover{background:var(--bg2); color:var(--text)}
.topbar nav button.active{background:var(--accent); color:#fff}
.search-wrap{
  margin-left:auto; position:relative;
}
.search-wrap input{
  padding:.45rem .8rem .45rem 2.2rem; border:1px solid var(--border);
  border-radius:8px; font-size:.88rem; width:200px; outline:none;
  transition: border .15s;
}
.search-wrap input:focus{border-color:var(--accent); width:240px}
.search-wrap::before{content:'🔍'; position:absolute; left:.6rem; top:50%; transform:translateY(-50%); font-size:.8rem}
/* ── MAIN CONTENT ──────────── */
main{max-width:1100px; margin:0 auto; padding:2rem 1.5rem}
.view{display:none}
.view.active{display:block}
/* ── HOME ──────────────────── */
.hero-section{
  text-align:center; padding:3rem 1rem 2rem;
}
.hero-section h1{font-size:2.2rem; font-weight:800; color:var(--text); margin-bottom:.5rem}
.hero-section p{color:var(--text2); font-size:1.05rem; max-width:600px; margin:0 auto}
.subject-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
  gap:1.25rem; margin-top:2rem;
}
.subject-card{
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:2rem 1.5rem; cursor:pointer; transition: all .18s;
  box-shadow: var(--shadow); text-align:center;
}
.subject-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md)}
.subject-card .icon{font-size:2.5rem; margin-bottom:.75rem; display:block}
.subject-card h3{font-size:1.2rem; font-weight:700; margin-bottom:.3rem}
.subject-card p{color:var(--text2); font-size:.88rem}
.subject-card.math{border-top:4px solid var(--accent)}
.subject-card.english{border-top:4px solid var(--green)}
.subject-card.reading{border-top:4px solid var(--amber)}
.subject-card.science{border-top:4px solid var(--purple)}
/* ── CATEGORY GRID ─────────── */
.section-header{margin-bottom:2rem}
.section-header h2{font-size:1.6rem; font-weight:700}
.section-header p{color:var(--text2); margin-top:.25rem}
.breadcrumb{
  display:flex; align-items:center; gap:.5rem; margin-bottom:1.5rem;
  font-size:.88rem; color:var(--text2);
}
.breadcrumb button{
  background:none; border:none; color:var(--accent); cursor:pointer;
  font-size:.88rem; font-weight:600; padding:0;
}
.breadcrumb button:hover{text-decoration:underline}
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
  gap:1rem;
}
.cat-card{
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:1.5rem; cursor:pointer; transition:all .15s;
  box-shadow:var(--shadow);
}
.cat-card:hover{box-shadow:var(--shadow-md); border-color:var(--accent)}
.cat-card h4{font-size:1.05rem; font-weight:700; margin-bottom:.3rem}
.cat-card .count{font-size:.82rem; color:var(--text2)}
/* ── TOPIC LIST ────────────── */
.topic-list{display:flex; flex-direction:column; gap:.5rem}
.topic-row{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  display:flex; align-items:center; justify-content:space-between;
  padding:.85rem 1.2rem; cursor:pointer; transition:all .12s;
  box-shadow:var(--shadow);
}
.topic-row:hover{background:#fafbfc; border-color:var(--accent)}
.topic-row .tname{font-weight:600; font-size:.95rem}
.topic-row .tmeta{display:flex; gap:.75rem; align-items:center}
.topic-row .difficulty{
  font-size:.75rem; padding:.2rem .6rem; border-radius:100px;
  font-weight:600;
}
.difficulty.easy{background:#d1fae5; color:#065f46}
.difficulty.medium{background:#fef3c7; color:#92400e}
.difficulty.hard{background:#fee2e2; color:#991b1b}
/* ── TOPIC DETAIL (AI TUTOR) ─ */
.detail-panel{
  background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:2rem; box-shadow:var(--shadow-md); margin-bottom:1.5rem;
}
.detail-panel h3{font-size:1.4rem; font-weight:700; margin-bottom:1rem}
.ai-explanation{
  background:linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
  border-left:4px solid var(--accent); border-radius:0 var(--radius) var(--radius) 0;
  padding:1.5rem; margin:1.25rem 0; font-size:.95rem; line-height:1.75;
}
.ai-explanation .ai-label{
  font-size:.78rem; font-weight:700; color:var(--accent);
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:.5rem; display:block;
}
.ai-explanation strong{color:var(--text)}
.ai-explanation ul, .ai-explanation ol{margin:.5rem 0 .5rem 1.5rem}
.ai-explanation li{margin-bottom:.25rem}
.ai-explanation code{
  background:#dbeafe; padding:.15rem .4rem; border-radius:4px;
  font-size:.9rem; color:var(--accent);
}
.yt-btn{
  display:inline-flex; align-items:center; gap:.5rem;
  background:#ff0000; color:#fff; padding:.7rem 1.5rem;
  border-radius:100px; text-decoration:none; font-weight:700;
  font-size:.9rem; margin-top:1rem; transition:opacity .15s;
}
.yt-btn:hover{opacity:.85}
.back-btn{
  display:inline-flex; align-items:center; gap:.4rem;
  background:none; border:1px solid var(--border); color:var(--text2);
  padding:.5rem 1rem; border-radius:8px; cursor:pointer;
  font-size:.88rem; font-weight:600; margin-bottom:1rem; transition:all .12s;
}
.back-btn:hover{background:var(--bg2); color:var(--text)}
/* ── RESPONSIVE ────────────── */
@media(max-width:768px){
  .topbar{flex-wrap:wrap; height:auto; padding:.75rem 1rem; gap:.5rem}
  .topbar nav{order:3; flex-basis:100%}
  .search-wrap{order:2}
  .search-wrap input{width:140px}
  .search-wrap input:focus{width:160px}
  .hero-section h1{font-size:1.5rem}
  .cat-grid{grid-template-columns:1fr}
}
/* ── MISC ──────────────────── */
.no-results{
  text-align:center; padding:3rem; color:var(--text2);
}
mark{background:#fef08a; padding:0 .2rem; border-radius:2px}
</style>
</head>
<body>
<!-- ═══════════ TOP BAR ═══════════ -->
<div class="topbar">
  <div class="logo">ACT<span>Genie</span></div>
  <nav>
    <button class="active" data-view="home">🏠 Home</button>
    <button data-view="math">📐 Math</button>
    <button data-view="english">📝 English</button>
    <button data-view="reading">📖 Reading</button>
    <button data-view="science">🔬 Science</button>
  </nav>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search topics…" oninput="doSearch()">
  </div>
</div>
<!-- ═══════════ MAIN ═══════════ -->
<main id="mainContent"></main>
<script>
// ╔══════════════════════════════════════════╗
// ║           DATA: ALL ACT TOPICS          ║
// ╚══════════════════════════════════════════╝
const data = {
  math: {
    title: 'ACT Math',
    desc: '45 questions · 50 minutes · 4 answer choices per question',
    categories: [
      {
        name: 'Pre-Algebra & Arithmetic',
        topics: [
          {name:'Number Types & Properties', video:'NumTypesScene.mp4', diff:'easy', expl:`<strong>Real numbers</strong> include rational (fractions, decimals that end or repeat) and irrational numbers (like π and √2). <strong>Integers</strong> are whole numbers (…-2,-1,0,1,2…). Know the difference between <strong>prime</strong> (divisible only by 1 and itself), <strong>composite</strong>, even/odd, and positive/negative numbers.<br><br><strong>Key rule:</strong> The product of two negative numbers is positive. The sum of two even numbers is even.`},
          {name:'Factors, Multiples & Divisibility', diff:'easy', expl:`<strong>GCF (Greatest Common Factor):</strong> The largest number that divides evenly into two or more numbers. Find it by listing factors or using prime factorization.<br><br><strong>LCM (Least Common Multiple):</strong> The smallest number that is a multiple of two or more numbers.<br><br><strong>Divisibility rules:</strong> A number is divisible by 3 if the sum of its digits is divisible by 3. Divisible by 4 if the last two digits form a number divisible by 4.`},
          {name:'Fractions, Decimals & Percentages', video:'FractionsScene.mp4', diff:'medium', expl:`These three are different ways to express the same thing.<br><br>• <strong>Fraction → Decimal:</strong> Divide numerator by denominator<br>• <strong>Decimal → Percent:</strong> Multiply by 100<br>• <strong>Percent → Fraction:</strong> Put over 100 and simplify<br><br><strong>Percent change formula:</strong> <code>(new − old) / old × 100</code>. A $40 shirt on sale for $30 is a <strong>25% decrease</strong>.`},
          {name:'Ratios & Proportions', video:'RatiosScene.mp4', diff:'medium', expl:`A <strong>ratio</strong> compares two quantities (e.g., 3:4). A <strong>proportion</strong> says two ratios are equal: <code>a/b = c/d</code>.<br><br><strong>Cross-multiply</strong> to solve: <code>a × d = b × c</code>.<br><br>If 3 oranges cost $2, how much for 15 oranges? Set up <code>3/2 = 15/x</code>, cross-multiply: <code>3x = 30</code>, so <code>x = $10</code>.`},
          {name:'Scientific Notation', diff:'easy', expl:`Used for very large or very small numbers.<br><br><code>3.5 × 10⁶ = 3,500,000</code> (move decimal right 6)<br><code>4.2 × 10⁻³ = 0.0042</code> (move decimal left 3)<br><br>To multiply: <code>(a×10ᵐ)(b×10ⁿ) = ab × 10ᵐ⁺ⁿ</code>. ACT questions often test converting between standard form and scientific notation.`},
          {name:'Mean, Median, Mode & Range', video:'StatsScene.mp4', diff:'easy', expl:`<strong>Mean:</strong> Sum divided by count (the "average").<br><strong>Median:</strong> Middle value when sorted. If there are two middle values, average them.<br><strong>Mode:</strong> Most frequent value.<br><strong>Range:</strong> Max − Min.<br><br>Watch out: an <strong>outlier</strong> pulls the mean but doesn't affect the median much. ACT loves testing this distinction.`},
          {name:'Basic Probability', video:'ProbabilityScene.mp4', diff:'medium', expl:`<strong>Probability = desired outcomes / total outcomes</strong><br><br>Probability of rolling a 5 on a die: <code>1/6</code>.<br>Probability of NOT rolling a 5: <code>1 − 1/6 = 5/6</code>.<br><br>For <strong>AND</strong> (both events happen): multiply probabilities.<br>For <strong>OR</strong> (either event happens): add probabilities, then subtract the overlap.`},
          {name:'Order of Operations (PEMDAS)', video:'PEMDASScene.mp4', diff:'easy', expl:`<strong>P</strong>arentheses → <strong>E</strong>xponents → <strong>M</strong>ultiplication/<strong>D</strong>ivision (left to right) → <strong>A</strong>ddition/<strong>S</strong>ubtraction (left to right).<br><br>Example: <code>3 + 4 × 2</code><br>= <code>3 + 8</code> (multiplication first!)<br>= <code>11</code> (NOT 14!)<br><br>The ACT will test whether you multiply before adding. Don't fall for the trap.`},
        ]
      },
      {
        name: 'Elementary Algebra',
        topics: [
          {name:'Solving Linear Equations', video:'LinearEquationScene.mp4', diff:'easy', expl:`Get the variable alone on one side. Whatever you do to one side, do to the other.<br><br>Example: <code>3x + 5 = 20</code><br>Subtract 5: <code>3x = 15</code><br>Divide by 3: <code>x = 5</code><br><br>For equations with variables on both sides, collect all variable terms on one side first.`, khan:'https://www.khanacademy.org/test-prep/v2-sat-math/x0fcc98a58ba3bea7:algebra-easier/x0fcc98a58ba3bea7:solving-linear-equations-and-inequalities-easier/a/v2-sat-lesson-solving-linear-equations-and-inequalities'},
          {name:'Linear Inequalities', diff:'medium', expl:`Solved like equations, but with one crucial difference: <strong>if you multiply or divide by a negative number, flip the inequality sign.</strong><br><br>Example: <code>−2x > 6</code><br>Divide by −2: <code>x < −3</code> (flipped!)<br><br>On a number line: open circle for < or >, closed circle for ≤ or ≥.`},
          {name:'Evaluating Expressions', diff:'easy', expl:`Plug in the given values and simplify.<br><br>Example: If <code>x = 3</code> and <code>y = −1</code>, evaluate <code>2x² − 3y</code>.<br><code>2(3)² − 3(−1)</code><br><code>= 2(9) + 3</code><br><code>= 18 + 3 = 21</code><br><br>Pay attention to negative signs — they're the #1 source of careless errors.`},
          {name:'Combining Like Terms', video:'CombinedLikeTermsScene.mp4', diff:'easy', expl:`Terms with the same variable and exponent can be combined by adding or subtracting their coefficients.<br><br>Example: <code>3x² + 5x − 2x² + 7x</code><br>= <code>(3x² − 2x²) + (5x + 7x)</code><br>= <code>x² + 12x</code><br><br>You CANNOT combine <code>x²</code> and <code>x</code> — they have different exponents.`},
          {name:'FOIL & Multiplying Binomials', diff:'medium', expl:`<strong>F</strong>irst <strong>O</strong>uter <strong>I</strong>nner <strong>L</strong>ast<br><br><code>(x + 3)(x + 5)</code><br>First: <code>x × x = x²</code><br>Outer: <code>x × 5 = 5x</code><br>Inner: <code>3 × x = 3x</code><br>Last: <code>3 × 5 = 15</code><br>Result: <code>x² + 8x + 15</code><br><br>Common patterns to memorize: <code>(a+b)² = a² + 2ab + b²</code> and <code>(a+b)(a−b) = a² − b²</code> (difference of squares).`},
          {name:'Factoring Quadratics', video:'QuadraticsScene.mp4', diff:'medium', expl:`Reverse of FOIL. Find two numbers that multiply to <code>c</code> and add to <code>b</code>.<br><br>Example: <code>x² + 7x + 12</code><br>What multiplies to 12 and adds to 7? <strong>3 and 4!</strong><br>Answer: <code>(x + 3)(x + 4)</code><br><br><strong>Difference of squares:</strong> <code>x² − 25 = (x+5)(x−5)</code> — instantly recognizable pattern.`, khan:'https://www.khanacademy.org/test-prep/v2-sat-math/x0fcc98a58ba3bea7:advanced-math-easier/x0fcc98a58ba3bea7:factoring-quadratic-and-polynomial-expressions-easier/a/v2-sat-lesson-factoring-quadratic-and-polynomial-expressions'},
          {name:'Solving Quadratic Equations', video:'DiscriminantScene.mp4', diff:'medium', expl:`Three methods:<br><br>1. <strong>Factoring:</strong> Set equation = 0, factor, set each factor = 0.<br><br>2. <strong>Quadratic Formula:</strong> For <code>ax² + bx + c = 0</code>:<br><code>x = [−b ± √(b² − 4ac)] / 2a</code><br><br>3. <strong>Completing the Square:</strong> Less common on ACT but worth knowing.<br><br>The <strong>discriminant</strong> (<code>b² − 4ac</code>) tells you: positive → 2 real roots, zero → 1 real root, negative → 0 real roots.`},
          {name:'Word Problems Setup', diff:'hard', expl:`The hardest part is translating English into math. Look for keywords:<br><br>• "is" / "equals" → <code>=</code><br>• "more than" → <code>+</code><br>• "less than" → <code>−</code> (order matters!)<br>• "of" → <code>×</code><br>• "per" → division or rate<br><br>Define your variable first: "Let <code>x</code> = …" then build the equation piece by piece. Practice is the only way to get faster.`},
        ]
      },
      {
        name: 'Intermediate Algebra',
        topics: [
          {name:'Systems of Equations', diff:'medium', expl:`Two methods:<br><br><strong>Substitution:</strong> Solve one equation for a variable, plug into the other.<br><br><strong>Elimination:</strong> Add or subtract equations to cancel one variable.<br><br>Example: <code>x + y = 10</code> and <code>x − y = 4</code>. Add them: <code>2x = 14</code>, so <code>x = 7, y = 3</code>.<br><br>A system has: <strong>1 solution</strong> (lines intersect), <strong>0 solutions</strong> (parallel), or <strong>infinite</strong> (same line).`, khan:'https://www.khanacademy.org/test-prep/v2-sat-math/x0fcc98a58ba3bea7:algebra-easier/x0fcc98a58ba3bea7:solving-systems-of-linear-equations-easier/a/v2-sat-lesson-solving-systems-of-linear-equations'},
          {name:'Absolute Value Equations', video:'AbsoluteValueScene.mp4', diff:'medium', expl:`<code>|x| = 3</code> means <code>x = 3</code> OR <code>x = −3</code>. Absolute value gives distance from zero, so you always get two cases (unless it equals 0).<br><br>Example: <code>|2x − 1| = 5</code><br>Case 1: <code>2x − 1 = 5</code> → <code>x = 3</code><br>Case 2: <code>2x − 1 = −5</code> → <code>x = −2</code><br><br>For inequalities like <code>|x| < 4</code>, think: distance from zero is less than 4, so <code>−4 < x < 4</code>.`},
          {name:'Rational Expressions', diff:'hard', expl:`Fractions with variables. Key steps:<br><br>1. <strong>Factor</strong> numerator and denominator<br>2. <strong>Cancel</strong> common factors<br>3. Find <strong>restrictions</strong>: denominator ≠ 0<br><br>Example: <code>(x²−4)/(x+2) = (x+2)(x−2)/(x+2) = x−2</code> (but x ≠ −2!)<br><br>To add/subtract: find a common denominator first.`},
          {name:'Exponents & Radicals', video:'ExponentScene.mp4', diff:'medium', expl:`Essential rules:<br>• <code>xᵃ × xᵇ = xᵃ⁺ᵇ</code><br>• <code>xᵃ / xᵇ = xᵃ⁻ᵇ</code><br>• <code>(xᵃ)ᵇ = xᵃᵇ</code><br>• <code>x⁻ᵃ = 1/xᵃ</code><br>• <code>x^(1/n) = ⁿ√x</code> (fractional exponents are roots!)<br><br>Example: <code>8^(2/3) = (³√8)² = 2² = 4</code>. The denominator of the fraction tells you the root.`},
          {name:'Logarithms', diff:'hard', expl:`A logarithm is the inverse of an exponent.<br><br><code>log_b(x) = y</code> means <code>bʸ = x</code>.<br><br>Key rules:<br>• <code>log(xy) = log(x) + log(y)</code><br>• <code>log(x/y) = log(x) − log(y)</code><br>• <code>log(xⁿ) = n·log(x)</code><br>• <code>log_b(b) = 1</code> and <code>log_b(1) = 0</code><br><br>ACT logs are always straightforward — just rewrite in exponential form if stuck.`},
          {name:'Complex Numbers', diff:'hard', expl:`<code>i = √(−1)</code>, so <code>i² = −1</code>.<br><br>Complex numbers have form <code>a + bi</code>.<br>To add: <code>(3+2i) + (1−5i) = 4 − 3i</code><br>To multiply: FOIL as usual, then replace <code>i²</code> with <code>−1</code>.<br><br>Powers of <code>i</code> cycle: <code>i¹=i, i²=−1, i³=−i, i⁴=1</code>, then repeats.`},
          {name:'Sequences & Series', diff:'medium', expl:`<strong>Arithmetic:</strong> Add a constant difference each time. nth term: <code>aₙ = a₁ + (n−1)d</code>.<br><br><strong>Geometric:</strong> Multiply by a constant ratio each time. nth term: <code>aₙ = a₁ × rⁿ⁻¹</code>.<br><br>Example: 3, 6, 12, 24… is geometric with r=2. The 5th term: <code>3 × 2⁴ = 48</code>.<br><br>ACT usually just asks for the next term or a specific term — use the pattern.`},
        ]
      },
      {
        name: 'Coordinate Geometry',
        topics: [
          {name:'Slope of a Line', video:'SlopeScene.mp4', diff:'easy', expl:`<strong>Slope = rise/run = (y₂ − y₁)/(x₂ − x₁)</strong><br><br>Positive slope: line goes up to the right ↗<br>Negative slope: line goes down to the right ↘<br>Zero slope: horizontal line<br>Undefined slope: vertical line<br><br>Parallel lines have <strong>equal</strong> slopes. Perpendicular lines have <strong>negative reciprocal</strong> slopes (product = −1).`},
          {name:'Equations of Lines', diff:'medium', expl:`<strong>Slope-intercept form:</strong> <code>y = mx + b</code> (m = slope, b = y-intercept)<br><strong>Point-slope form:</strong> <code>y − y₁ = m(x − x₁)</code><br><strong>Standard form:</strong> <code>Ax + By = C</code><br><br>Given two points, find slope first, then plug into point-slope form. The ACT will ask you to identify or write the equation.`},
          {name:'Distance & Midpoint Formulas', diff:'medium', expl:`<strong>Distance:</strong> <code>d = √[(x₂−x₁)² + (y₂−y₁)²]</code> — this is just the Pythagorean Theorem on the coordinate plane.<br><br><strong>Midpoint:</strong> <code>((x₁+x₂)/2, (y₁+y₂)/2)</code> — average the x's, average the y's.<br><br>Example: Midpoint of (2,5) and (8,−1) is <code>((2+8)/2, (5+(−1))/2) = (5, 2)</code>.`},
          {name:'Circles in the Coordinate Plane', diff:'medium', expl:`Standard form: <code>(x − h)² + (y − k)² = r²</code><br>Center: <code>(h, k)</code>, Radius: <code>r</code><br><br>Example: <code>(x − 3)² + (y + 2)² = 25</code> has center (3, −2) and radius 5.<br><br>If given <code>x² + y² + 6x − 4y = 12</code>, <strong>complete the square</strong> for both x and y to get standard form.`, khan:'https://www.khanacademy.org/test-prep/v2-sat-math/x0fcc98a58ba3bea7:geometry-and-trigonometry-easier/x0fcc98a58ba3bea7:circle-equations-easier/a/v2-sat-lesson-circle-equations'},
          {name:'Graphing Inequalities', video:'InequalityScene.mp4', diff:'medium', expl:`<code>y > 2x + 1</code> means shade ABOVE the line.<br><code>y < 2x + 1</code> means shade BELOW.<br><br>Use a <strong>dashed line</strong> for < or > (points on the line are NOT included).<br>Use a <strong>solid line</strong> for ≤ or ≥ (points on the line are included).<br><br>To test which side to shade, plug in (0,0): if it satisfies the inequality, shade that side.`},
        ]
      },
      {
        name: 'Plane Geometry',
        topics: [
          {name:'Angles & Parallel Lines', diff:'easy', expl:`When a line crosses two parallel lines:<br>• <strong>Corresponding angles</strong> are equal<br>• <strong>Alternate interior angles</strong> are equal<br>• <strong>Same-side interior angles</strong> sum to 180°<br>• <strong>Vertical angles</strong> are always equal<br><br>Supplementary angles sum to 180°. Complementary angles sum to 90°.`},
          {name:'Triangles', video:'TrianglesScene.mp4', diff:'medium', expl:`• All angles sum to <strong>180°</strong><br>• Area = <strong>½ × base × height</strong><br>• <strong>Pythagorean Theorem:</strong> <code>a² + b² = c²</code> (right triangles only)<br><br><strong>Special right triangles:</strong><br>30°-60°-90°: sides in ratio <code>x : x√3 : 2x</code><br>45°-45°-90°: sides in ratio <code>x : x : x√2</code><br><br>The largest angle faces the longest side.`},
          {name:'Similar & Congruent Triangles', diff:'medium', expl:`<strong>Congruent:</strong> Same shape AND size (SSS, SAS, ASA, AAS).<br><strong>Similar:</strong> Same shape, different size (AA is enough!).<br><br>In similar triangles, corresponding sides are <strong>proportional</strong>. If ΔABC ~ ΔDEF and AB=4, DE=8, BC=6, then EF=<strong>12</strong> (scale factor is 2).<br><br>ACT loves testing similarity with overlapping triangles and parallel lines.`},
          {name:'Quadrilaterals & Polygons', diff:'medium', expl:`<strong>Sum of interior angles</strong> of an n-sided polygon: <code>(n−2) × 180°</code><br><br>• Square: 4 equal sides, 4 right angles, Area = s²<br>• Rectangle: opposite sides equal, Area = l×w<br>• Parallelogram: Area = base×height (NOT side×side!)<br>• Trapezoid: Area = ½(b₁+b₂)×h (average of parallel sides × height)<br>• Rhombus: 4 equal sides, diagonals are perpendicular`},
          {name:'Circles', video:'CirclesScene.mp4', diff:'medium', expl:`• <strong>Circumference:</strong> <code>C = 2πr</code> or <code>C = πd</code><br>• <strong>Area:</strong> <code>A = πr²</code><br>• <strong>Arc length:</strong> <code>(θ/360°) × 2πr</code><br>• <strong>Sector area:</strong> <code>(θ/360°) × πr²</code><br><br>An <strong>inscribed angle</strong> is half the measure of its intercepted arc. A central angle equals its arc. An angle inscribed in a semicircle is always 90°.`},
          {name:'3D Geometry', diff:'medium', expl:`• <strong>Cube:</strong> Volume = s³, Surface Area = 6s²<br>• <strong>Rectangular prism:</strong> V = l×w×h, SA = 2(lw+lh+wh)<br>• <strong>Cylinder:</strong> V = πr²h, SA = 2πr²+2πrh<br>• <strong>Cone:</strong> V = ⅓πr²h<br>• <strong>Sphere:</strong> V = ⁴⁄₃πr³, SA = 4πr²<br><br>ACT often asks for volume or surface area directly — just plug into the formula. They sometimes provide the formula in the question.`},
        ]
      },
      {
        name: 'Trigonometry',
        topics: [
          {name:'SOH-CAH-TOA', video:'SOHCAHTOAScene.mp4', diff:'medium', expl:`For right triangles only:<br>• <strong>sin(θ) = Opposite/Hypotenuse</strong><br>• <strong>cos(θ) = Adjacent/Hypotenuse</strong><br>• <strong>tan(θ) = Opposite/Adjacent</strong><br><br>Example: In a right triangle with opposite=3 and hypotenuse=5, sin(θ)=3/5=0.6.<br><br>Use inverse functions (sin⁻¹ on calculator) to find the angle when you know the ratio.`, khan:'https://www.khanacademy.org/test-prep/v2-sat-math/x0fcc98a58ba3bea7:geometry-and-trigonometry-easier/x0fcc98a58ba3bea7:right-triangle-trigonometry-easier/a/v2-sat-lesson-right-triangle-trigonometry'},
          {name:'Reciprocal Trig Functions', diff:'hard', expl:`• <strong>csc(θ) = 1/sin(θ)</strong><br>• <strong>sec(θ) = 1/cos(θ)</strong><br>• <strong>cot(θ) = 1/tan(θ)</strong><br><br>Rare on ACT, but good to know. If you see csc(θ)=2, rewrite as sin(θ)=1/2, then solve.<br><br>Also: <code>tan(θ) = sin(θ)/cos(θ)</code>.`},
          {name:'Unit Circle & Special Angles', diff:'hard', expl:`Memorize these values:<br><br>| θ | sin | cos | tan |<br>|---|---|---|---|<br>| 0° | 0 | 1 | 0 |<br>| 30° | ½ | √3/2 | 1/√3 |<br>| 45° | √2/2 | √2/2 | 1 |<br>| 60° | √3/2 | ½ | √3 |<br>| 90° | 1 | 0 | undefined |<br><br>Also know conversions: <strong>180° = π radians</strong>. Multiply by π/180 to convert.`},
          {name:'Law of Sines & Cosines', diff:'hard', expl:`For NON-right triangles:<br><br><strong>Law of Sines:</strong> <code>sin(A)/a = sin(B)/b = sin(C)/c</code><br>Use when you know: 2 angles + 1 side (AAS/ASA) or 2 sides + non-included angle (SSA).<br><br><strong>Law of Cosines:</strong> <code>c² = a² + b² − 2ab·cos(C)</code><br>Use when you know: 2 sides + included angle (SAS) or 3 sides (SSS).`},
        ]
      },
      {
        name: 'Functions',
        topics: [
          {name:'Function Notation', diff:'easy', expl:`<code>f(x)</code> means "the output when the input is x."<br><br>If <code>f(x) = 2x + 3</code>, then <code>f(4) = 2(4) + 3 = 11</code>.<br><br>For <code>f(g(x))</code>, work inside out: compute <code>g(x)</code> first, then plug that into <code>f</code>.<br><br>Watch for: <code>f(x+1)</code> means replace every <code>x</code> with <code>(x+1)</code>.`},
          {name:'Domain & Range', diff:'medium', expl:`<strong>Domain:</strong> All possible x-values (inputs).<br><strong>Range:</strong> All possible y-values (outputs).<br><br>Restrictions:<br>• Denominator ≠ 0<br>• Under a square root must be ≥ 0<br>• Under a log must be > 0<br><br>Example: f(x) = √(x−2) has domain x ≥ 2 (can't take square root of negative). Range: y ≥ 0.`},
          {name:'Function Transformations', video:'FunctionsScene.mp4', diff:'medium', expl:`<code>f(x) + k</code> → shift UP by k<br><code>f(x) − k</code> → shift DOWN by k<br><code>f(x + k)</code> → shift LEFT by k (counterintuitive!)<br><code>f(x − k)</code> → shift RIGHT by k<br><code>−f(x)</code> → reflect across x-axis<br><code>f(−x)</code> → reflect across y-axis<br><code>a·f(x)</code> → vertical stretch if a>1, shrink if 0<a<1<br><br>ACT often tests: given a graph, what's the equation? Apply transformations to a known parent function.`},
          {name:'Composition & Inverses', diff:'hard', expl:`<strong>Composition:</strong> <code>(f∘g)(x) = f(g(x))</code>. Plug g(x) into f.<br><br><strong>Inverse:</strong> Swap x and y, then solve for y. Notation: <code>f⁻¹(x)</code>.<br><br>Example: f(x) = 2x+3. Write y=2x+3, swap: x=2y+3, solve: y=(x−3)/2, so f⁻¹(x)=(x−3)/2.<br><br>Graphically, inverse functions are reflections across the line y=x.`},
        ]
      },
      {
        name: 'Statistics & Probability',
        topics: [
          {name:'Counting Principles', diff:'medium', expl:`<strong>Fundamental Counting Principle:</strong> If event A has m outcomes and event B has n outcomes, then A followed by B has m×n outcomes.<br><br><strong>Permutations</strong> (order matters): <code>nPr = n!/(n−r)!</code><br><strong>Combinations</strong> (order doesn't matter): <code>nCr = n!/[r!(n−r)!]</code><br><br>Tip: If the problem mentions "arrangement" or "order," use permutation. If it says "group" or "committee," use combination.`},
          {name:'Advanced Probability', diff:'hard', expl:`<strong>AND (both):</strong> P(A and B) = P(A) × P(B|A)<br><strong>OR (either):</strong> P(A or B) = P(A) + P(B) − P(A and B)<br><strong>Conditional:</strong> P(A|B) = P(A and B)/P(B)<br><br>Example: Drawing two aces from a deck without replacement:<br>P = (4/52) × (3/51) = 12/2652 ≈ 0.0045<br><br>With replacement it would be (4/52) × (4/52) — much simpler.`},
          {name:'Expected Value', diff:'hard', expl:`The weighted average of all possible outcomes.<br><br>Example: A game costs $5. You win $20 with probability 0.1, $10 with probability 0.2, and $0 otherwise. Expected value = 0.1(20) + 0.2(10) + 0.7(0) − 5 = 2+2+0−5 = <strong>−$1</strong>. On average, you lose $1 per play.<br><br>ACT expected value questions are rare — maybe 1 per test at most.`},
          {name:'Scatterplots & Lines of Best Fit', video:'ScatterplotScene.mp4', diff:'medium', expl:`A <strong>line of best fit</strong> (regression line) shows the trend in a scatterplot.<br><br>• Positive correlation: as x increases, y increases<br>• Negative correlation: as x increases, y decreases<br>• No correlation: no clear pattern<br><br>The ACT may ask you to estimate a value from the line or identify which equation best fits the data. Don't overthink — look at the overall trend, not individual points.`},
        ]
      },
    ]
  },
  english: {
    title: 'ACT English',
    desc: '50 questions · 35 minutes · Grammar, style & rhetoric',
    categories: [
      {
        name: 'Punctuation',
        topics: [
          {name:'Commas', diff:'medium', expl:`The most-tested punctuation mark on the ACT.<br><br><strong>Use commas:</strong><br>• After introductory phrases: <em>After the game, we went home.</em><br>• Around nonessential clauses: <em>My dog, who is very old, sleeps all day.</em><br>• In lists: <em>I bought apples, bananas, and oranges.</em><br>• Between coordinate adjectives: <em>a cold, rainy day</em><br><br><strong>Don't use commas:</strong><br>• Between a subject and its verb: ❌ <em>The cat, sat down.</em><br>• With restrictive "that" clauses (no commas around essential info).<br>• To join two complete sentences alone (comma splice!)`, khan:'https://www.khanacademy.org/test-prep/sat-reading-and-writing/x0d47bcec73eb6c4b:digital-sat-grammar-practice/x0d47bcec73eb6c4b:boundaries-punctuation/a/grammar-guide-punctuation'},
          {name:'Semicolons', diff:'medium', expl:`A semicolon joins two complete, related sentences WITHOUT a conjunction.<br><br>✅ Correct: <em>I studied all night; I aced the test.</em><br>❌ Wrong: <em>I studied all night; and I aced the test.</em> (don't use both)<br><br>Also correct with conjunctive adverbs: <em>It rained; however, we still went.</em><br><br>Think of a semicolon as a "soft period" — it connects two ideas that belong together. If a period or a comma+FANBOYS would also work, the semicolon might be right.`, khan:'https://www.khanacademy.org/humanities/grammar/punctuation-the-colon-semicolon-and-more/introduction-to-colons/v/linking-function-of-the-colon-the-colon-and-semicolon-punctuation-khan-academy'},
          {name:'Colons', diff:'medium', expl:`A colon must follow a <strong>complete sentence</strong> and introduces something: a list, an explanation, or a quote.<br><br>✅ Correct: <em>I need three things: milk, eggs, and bread.</em><br>❌ Wrong: <em>I need: milk, eggs, and bread.</em> ("I need" is not a complete sentence.)<br><br>✅ Correct: <em>She had one goal: to win.</em><br><br>If you can replace the colon with "namely" or "that is," it's probably right.`, khan:'https://www.khanacademy.org/humanities/grammar/punctuation-the-colon-semicolon-and-more/introduction-to-colons/v/the-colon-as-a-separator-the-colon-and-semicolon-punctuation-khan-academy'},
          {name:'Apostrophes', diff:'easy', expl:`Two uses only:<br><br>1. <strong>Possession:</strong> <em>the dog's bone</em> (singular), <em>the dogs' bones</em> (plural)<br>2. <strong>Contractions:</strong> <em>it's = it is</em>, <em>don't = do not</em><br><br><strong>Its vs. It's:</strong> This is tested relentlessly. <em>Its</em> is possessive (like his/her). <em>It's</em> = it is. If you can replace with "it is," use the apostrophe.<br><br>❌ <em>The cat licked it's paw.</em> (wrong — no apostrophe for possessive its)<br>✅ <em>The cat licked its paw.</em>`},
          {name:'Dashes & Parentheses', diff:'medium', expl:`<strong>Dashes</strong> — set off dramatic interruptions or emphasis. More forceful than commas.<br><br><em>The answer — surprisingly — was wrong.</em><br><br><strong>Parentheses</strong> (like this) set off quieter asides, less emphasis than dashes.<br><br>If a dash opens an interruption, a second dash must close it (unless it ends the sentence). Same as commas for nonessential clauses — the sentence must make sense if you remove the material between dashes.`},
        ]
      },
      {
        name: 'Sentence Structure',
        topics: [
          {name:'Run-ons & Comma Splices', diff:'medium', expl:`A <strong>run-on</strong> joins two complete sentences with NO punctuation.<br>A <strong>comma splice</strong> joins them with ONLY a comma.<br><br>❌ <em>I love pizza it's delicious.</em> (run-on)<br>❌ <em>I love pizza, it's delicious.</em> (comma splice)<br><br>Four ways to fix:<br>1. Period: <em>I love pizza. It's delicious.</em><br>2. Semicolon: <em>I love pizza; it's delicious.</em><br>3. Comma + FANBOYS: <em>I love pizza, and it's delicious.</em><br>4. Subordinating conjunction: <em>I love pizza because it's delicious.</em>`, khan:'https://www.khanacademy.org/test-prep/sat-reading-and-writing/x0d47bcec73eb6c4b:digital-sat-grammar-practice/x0d47bcec73eb6c4b:boundaries-linking-clauses/v/linking-clauses-video'},
          {name:'Sentence Fragments', diff:'easy', expl:`A fragment is an incomplete sentence — missing a subject, a verb, or standing as a dependent clause alone.<br><br>❌ <em>Because the experiment failed.</em> (dependent clause — needs a main clause)<br>✅ <em>Because the experiment failed, we started over.</em><br><br>❌ <em>Running through the park on a sunny day.</em> (no subject, no main verb)<br>✅ <em>I was running through the park on a sunny day.</em><br><br>On the ACT, if a sentence feels incomplete, it probably is. Read it aloud in your head.`},
          {name:'Parallel Structure', diff:'medium', expl:`Items in a list or comparison must have the same grammatical form.<br><br>❌ <em>She likes swimming, biking, and to run.</em> (mixing gerunds and infinitive)<br>✅ <em>She likes swimming, biking, and running.</em><br>✅ <em>She likes to swim, to bike, and to run.</em><br><br>Paired conjunctions too:<br>❌ <em>He is not only smart but also works hard.</em> (adjective vs. verb phrase)<br>✅ <em>He is not only smart but also hardworking.</em><br><br>If you hear an awkward rhythm in a list, suspect a parallelism error.`, khan:'https://www.khanacademy.org/humanities/grammar'},
          {name:'Verb Tense Consistency', diff:'medium', expl:`Don't shift tenses without a reason.<br><br>❌ <em>She walked to the store and buys milk.</em> (past → present for no reason)<br>✅ <em>She walked to the store and bought milk.</em><br><br>When a passage is in the past, stay in the past. When it's in the present, stay present. Only shift if the timeline actually changes.<br><br>Also: use <strong>past perfect</strong> (<em>had walked</em>) for an action completed before another past action.`},
        ]
      },
      {
        name: 'Grammar & Usage',
        topics: [
          {name:'Subject-Verb Agreement', diff:'medium', expl:`The verb must match the subject in number.<br><br>Singular subject → singular verb: <em>The dog runs.</em><br>Plural subject → plural verb: <em>The dogs run.</em><br><br><strong>Tricky:</strong> Ignore prepositional phrases between subject and verb.<br>✅ <em>The box of chocolates <strong>is</strong> on the table.</em> (subject is "box," not "chocolates")<br><br>Indefinite pronouns that are ALWAYS singular: <em>each, everyone, anybody, neither, either</em>.<br>✅ <em>Everyone <strong>wants</strong> to succeed.</em>`, khan:'https://www.khanacademy.org/test-prep/sat-reading-and-writing/x0d47bcec73eb6c4b:digital-sat-grammar-practice/x0d47bcec73eb6c4b:boundaries-punctuation/a/grammar-guide-punctuation'},
          {name:'Pronoun Agreement & Case', diff:'medium', expl:`<strong>Agreement:</strong> Pronouns match their antecedent in number.<br>❌ <em>Each student must bring their book.</em> ("each" is singular)<br>✅ <em>Each student must bring his or her book.</em><br><br><strong>Case:</strong><br>Subject: I, he, she, we, they, who<br>Object: me, him, her, us, them, whom<br><br>✅ <em>Between you and <strong>me</strong></em> (object of preposition)<br>✅ <em><strong>Who</strong> called?</em> (subject of "called")<br>✅ <em>To <strong>whom</strong> did you speak?</em> (object of "to")`},
          {name:'Modifiers: Dangling & Misplaced', diff:'hard', expl:`A modifier must be next to what it describes.<br><br><strong>Dangling modifier</strong> (nothing to modify):<br>❌ <em>Walking to school, the rain started.</em> (the rain wasn't walking!)<br>✅ <em>Walking to school, I got caught in the rain.</em><br><br><strong>Misplaced modifier</strong> (modifying wrong thing):<br>❌ <em>I saw a dog riding my bike.</em> (the dog was riding your bike?)<br>✅ <em>Riding my bike, I saw a dog.</em><br><br>Always check: is the introductory phrase describing the subject that immediately follows?`},
          {name:'Comparisons', diff:'medium', expl:`Compare like things only.<br><br>❌ <em>Her grades are higher than her brother.</em> (comparing grades to brother)<br>✅ <em>Her grades are higher than her brother's.</em> (comparing grades to grades)<br><br><strong>Comparative vs. Superlative:</strong><br>Comparative (-er / more): for two things — <em>better, faster, more beautiful</em><br>Superlative (-est / more): for three+ things — <em>best, fastest, most beautiful</em><br><br>❌ <em>Of the two options, this is the best.</em><br>✅ <em>Of the two options, this is the better.</em>`},
          {name:'Adjectives vs. Adverbs', diff:'easy', expl:`<strong>Adjectives</strong> modify nouns: <em>a quick runner</em><br><strong>Adverbs</strong> modify verbs, adjectives, or other adverbs (often end in -ly): <em>ran quickly</em><br><br>❌ <em>She sings beautiful.</em> (needs adverb)<br>✅ <em>She sings beautifully.</em><br><br>With linking verbs (is, seems, feels, looks, smells), use adjectives:<br>✅ <em>The flower smells good.</em> (not "well" — unless you're saying the flower is healthy!)`},
        ]
      },
      {
        name: 'Rhetorical Skills',
        topics: [
          {name:'Add/Delete Questions', diff:'medium', expl:`Should a sentence be added or deleted? Ask:<br><br>1. Does it relate to the paragraph's <strong>main idea</strong>?<br>2. Does it add <strong>new, relevant</strong> information?<br>3. Does it match the <strong>tone</strong> of the passage?<br><br>The ACT prefers essays that are focused and concise. If a sentence is off-topic or repeats something already said, DELETE it — even if it's factually true and well-written.<br><br>Read the sentences before and after; the right answer keeps the paragraph cohesive.`},
          {name:'Transitions', diff:'medium', expl:`Transition words signal logical relationships:<br><br>• <strong>Addition:</strong> furthermore, moreover, also, in addition<br>• <strong>Contrast:</strong> however, but, yet, on the other hand, nevertheless<br>• <strong>Cause/Effect:</strong> therefore, thus, consequently, as a result<br>• <strong>Sequence:</strong> first, then, subsequently, finally<br>• <strong>Example:</strong> for instance, for example, specifically<br><br>Read the two sentences the transition connects. What's their relationship? Pick the transition that matches that logic.`},
          {name:'Organization & Paragraph Order', diff:'medium', expl:`Questions about moving sentences or paragraphs test logical flow.<br><br>Look for clues:<br>• <strong>Pronouns:</strong> "This theory…" — the previous sentence must introduce the theory.<br>• <strong>Chronology:</strong> Events should be in time order.<br>• <strong>Topic sentences:</strong> A paragraph's first sentence should introduce its subject.<br><br>Tip: Read the sentences in the proposed new order. Does the flow feel smoother or more logical?`},
          {name:'Conciseness & Redundancy', diff:'easy', expl:`The ACT values tight, efficient writing. When multiple answers are grammatically correct, the <strong>shortest</strong> one is usually best.<br><br>❌ <em>She returned back to the store.</em> ("returned" already means "went back")<br>✅ <em>She returned to the store.</em><br><br>Common redundancies to avoid:<br>• "past history" → "history"<br>• "completely finished" → "finished"<br>• "advance planning" → "planning"<br>• "end result" → "result"<br><br>If you can remove a word without changing meaning, remove it.`},
          {name:'Tone & Style', diff:'medium', expl:`Match the passage's register. A formal academic essay shouldn't use slang; a personal narrative shouldn't sound like a textbook.<br><br>Ask: What is the author's purpose? Who is the audience?<br><br>❌ In a formal essay: <em>The results were totally awesome.</em><br>✅ <em>The results were significant.</em><br><br>❌ In a personal narrative: <em>The individual proceeded to acquire sustenance.</em><br>✅ <em>I went to get some food.</em><br><br>Choose the option that sounds like the rest of the passage.`},
        ]
      },
      {
        name: 'Commonly Confused Words',
        topics: [
          {name:'Affect vs Effect', diff:'medium', expl:`<strong>Affect</strong> = verb (to influence): <em>The weather affects my mood.</em><br><strong>Effect</strong> = noun (result): <em>The effect was dramatic.</em><br><br>Rare: Effect can be a verb meaning "to bring about" (<em>to effect change</em>). Affect can be a noun in psychology (emotional affect). But 95% of the time: affect=verb, effect=noun.`},
          {name:'Than vs Then', diff:'easy', expl:`<strong>Than</strong> = comparison: <em>She is taller than me.</em><br><strong>Then</strong> = time/sequence: <em>We ate, then we left.</em><br><br>If you're comparing, use "than." If you're talking about what happened next, use "then."`},
          {name:'Who vs Whom', diff:'medium', expl:`<strong>Who</strong> = subject (does the action). <strong>Whom</strong> = object (receives the action).<br><br>Trick: Replace with he/him. If "he" fits, use "who." If "him" fits, use "whom."<br><br><em>___ called?</em> → <em>He called.</em> → <strong>Who</strong><br><em>To ___ did you give it?</em> → <em>To him.</em> → <strong>Whom</strong><br><br>The ACT tests this less often now, but it still appears.`},
          {name:'Its vs It\'s', diff:'easy', expl:`<strong>It's</strong> = it is (contraction)<br><strong>Its</strong> = possessive (belongs to it)<br><br>Test: replace with "it is." If the sentence still makes sense, use "it's." If not, use "its."<br><br>✅ <em>It's going to rain.</em> (= It is going to rain. ✓)<br>✅ <em>The dog wagged its tail.</em> (= The dog wagged it is tail. ✗ → use its)<br><br>This is one of the most-tested distinctions on the ACT.`},
          {name:'Their/There/They\'re', diff:'easy', expl:`<strong>Their</strong> = possessive (belongs to them)<br><strong>There</strong> = location<br><strong>They're</strong> = they are<br><br>✅ <em>They're going to their house over there.</em><br><br>Don't let this be the question you miss — it's free points if you slow down and check.`},
        ]
      },
    ]
  },
  reading: {
    title: 'ACT Reading',
    desc: '36 questions · 40 minutes · 4 passage types',
    categories: [
      {
        name: 'Key Ideas & Details',
        topics: [
          {name:'Main Idea / Central Theme', diff:'medium', expl:`The main idea is what the entire passage is about — its primary argument or thesis.<br><br>To find it:<br>• Read the first and last paragraphs carefully — the thesis often lives there.<br>• Ask: "If I had to summarize this in one sentence, what would I say?"<br>• Eliminate answers that are too narrow (just a detail) or too broad (goes beyond the text).<br><br>Warning: ACT wrong answers often sound plausible but focus on minor details rather than the core argument.`},
          {name:'Locating Specific Details', diff:'easy', expl:`These are "look-up" questions — the answer is stated directly in the passage.<br><br>Strategy:<br>1. Read the question and identify a keyword<br>2. Scan the passage for that keyword<br>3. Read 2-3 lines around it<br>4. Match to the answer choice<br><br>Don't rely on memory. Go back to the passage every time. The ACT will often use exact phrasing from the text in the right answer, and slightly twisted phrasing in wrong ones.`},
          {name:'Cause & Effect', diff:'medium', expl:`These questions ask why something happened or what resulted from an event.<br><br>Look for signal words: <em>because, since, as a result, consequently, led to, caused, therefore, thus</em>.<br><br>Strategy: Find the event in the passage, then look immediately before (for causes) or after (for effects). The ACT rarely makes you infer far — the relationship is usually stated nearby.<br><br>Beware of answer choices that reverse the cause and effect.`},
          {name:'Making Inferences', diff:'hard', expl:`An inference is a logical conclusion based on evidence in the text — NOT a guess.<br><br>Golden rule: <strong>Every correct inference must be directly supportable by the text.</strong> If you can't point to a specific line that supports it, it's probably wrong.<br><br>Example: If the passage says "She slammed the door and didn't say goodbye," you can infer she was angry — but you CAN'T infer she hated the person (too strong, not directly supported).<br><br>ACT inferences are conservative. Pick the answer that requires the smallest logical leap.`},
        ]
      },
      {
        name: 'Craft & Structure',
        topics: [
          {name:'Vocabulary in Context', diff:'medium', expl:`These questions ask what a word "most nearly means" as used in the passage.<br><br>Don't rely on your prior knowledge of the word — the ACT often tests secondary or uncommon meanings. <strong>Go back and read the sentence</strong>, then predict what meaning fits before looking at the choices.<br><br>Example: "He had a <em>sharp</em> mind." Sharp here means intelligent/quick, not pointy/edged.<br><br>Plug your predicted meaning into the sentence mentally. The right answer should fit seamlessly.`},
          {name:'Author\'s Purpose & Tone', diff:'medium', expl:`What is the author trying to accomplish?<br><br>Common purposes: to inform, to persuade, to entertain, to describe, to analyze, to criticize.<br><br><strong>Tone</strong> is the author's attitude: admiring, critical, neutral, humorous, concerned, hopeful, skeptical, etc.<br><br>How to identify: Look at word choice. "The policy was implemented" (neutral) vs. "The disastrous policy was imposed" (critical). Pay attention to adjectives and adverbs — they reveal the author's stance.`},
          {name:'Text Structure', diff:'medium', expl:`How is the passage built? Common structures:<br><br>• <strong>Chronological:</strong> Events in time order<br>• <strong>Cause/Effect:</strong> Explains why something happened<br>• <strong>Compare/Contrast:</strong> Similarities and differences<br>• <strong>Problem/Solution:</strong> Identifies a problem and proposes solutions<br>• <strong>Claim/Evidence:</strong> Makes an argument and supports it<br><br>Identifying the structure helps with main idea, paragraph function, and organization questions. Ask: "What is the author doing in this paragraph?"`},
          {name:'Point of View', diff:'medium', expl:`<strong>First person</strong> (I, we): Author is a participant or narrator<br><strong>Second person</strong> (you): Rare — author addresses the reader directly<br><strong>Third person limited</strong> (he, she): Narrator knows one character's thoughts<br><strong>Third person omniscient</strong>: Narrator knows all characters' thoughts<br><br>For paired passages especially: identify each author's perspective. Do they agree? Disagree? Approach the topic from different angles? The questions will ask you to compare them.`},
        ]
      },
      {
        name: 'Integration of Knowledge',
        topics: [
          {name:'Claims & Evidence', diff:'medium', expl:`These questions ask which evidence best supports a claim, or what claim a piece of evidence supports.<br><br>Strategy:<br>1. Identify the claim in the question<br>2. Go to the passage and find where the author makes or supports that claim<br>3. Look for facts, statistics, examples, or quotes that back it up<br>4. Match to the right answer<br><br>Wrong answers often cite information from the wrong part of the passage, or twist the evidence to support a slightly different claim.`},
          {name:'Paired Passages', diff:'hard', expl:`Two passages on the same topic, often from different perspectives.<br><br>Approach:<br>1. Read Passage 1 and answer its questions<br>2. Read Passage 2 and answer its questions<br>3. Answer the comparison questions last (you'll have both fresh in mind)<br><br>Comparison questions ask:<br>• Where do the authors AGREE?<br>• Where do they DISAGREE?<br>• How would Author 1 respond to Author 2's argument?<br><br>Create a mental (or scratch-paper) Venn diagram of their positions.`},
          {name:'Visual/Quantitative Integration', diff:'medium', expl:`Some passages include a graph, chart, or table.<br><br>These questions ask you to connect the data to the text. Usually 1-2 per test.<br><br>Strategy:<br>1. Read the question — it will tell you what to look for<br>2. Check the visual for the relevant data<br>3. Connect it to what the passage says about that data<br><br>Common: "Based on the passage and the graph, which statement is true?" Eliminate answers that contradict either the passage OR the graph. Both must support the right answer.`},
        ]
      },
      {
        name: 'Passage Types',
        topics: [
          {name:'Literary Narrative / Prose Fiction', diff:'medium', expl:`Excerpts from novels, short stories, or memoirs. Focus on characters, emotions, and relationships.<br><br>Key skills:<br>• Track the narrator's attitude and emotional shifts<br>• Identify character motivations (why did they do that?)<br>• Notice descriptive language and what it reveals<br>• Look for internal conflict or realization moments<br><br>These passages often have more inference questions. The "right" answer is the one most consistent with the character's personality and the story's tone.`},
          {name:'Social Studies', diff:'medium', expl:`Topics: history, economics, psychology, sociology, anthropology.<br><br>These passages are usually argument-driven. The author has a thesis and supports it with evidence.<br><br>Key skills:<br>• Identify the thesis in the first paragraph<br>• Track how each paragraph supports it<br>• Notice cause/effect relationships<br>• Pay attention to dates, names, and specific studies mentioned<br><br>Questions focus on the argument's logic: what claim is made, how is it supported, what counterarguments exist?`},
          {name:'Humanities', diff:'medium', expl:`Topics: art, music, philosophy, cultural criticism, personal essays.<br><br>These are often the most abstract passages. The author may be describing an artistic movement, analyzing a philosophical idea, or reflecting on a cultural phenomenon.<br><br>Key skills:<br>• Grasp the central thesis or aesthetic argument<br>• Understand the author's value judgments (what do they admire? criticize?)<br>• Track comparisons between artists, periods, or ideas<br>• Don't get lost in fancy language — focus on what the author is arguing`},
          {name:'Natural Sciences', diff:'medium', expl:`Topics: biology, chemistry, physics, astronomy, geology, medicine.<br><br>These passages explain scientific phenomena, experiments, or discoveries. They're dense with information but logically structured.<br><br>Key skills:<br>• Identify the main scientific concept being explained<br>• Track the sequence of a process or experiment<br>• Understand cause/effect relationships<br>• Don't panic if you don't know the science — everything you need is in the passage<br><br>These passages often have the most straightforward, factual questions. Go back to the text and find the answer.`},
        ]
      },
    ]
  },
  science: {
    title: 'ACT Science',
    desc: '40 questions · 40 minutes · Optional (+$4)',
    categories: [
      {
        name: 'Data Representation',
        topics: [
          {name:'Reading Graphs & Charts', diff:'easy', expl:`The most fundamental ACT Science skill. You'll see line graphs, bar charts, scatterplots, and pie charts.<br><br>Before answering questions, spend 15 seconds orienting:<br>1. <strong>Read the axes labels</strong> — what's being measured?<br>2. <strong>Note the units</strong> — seconds? meters? percent?<br>3. <strong>Check the legend</strong> — what do different lines/bars/colors represent?<br>4. <strong>Spot the trend</strong> — increasing, decreasing, or no pattern?<br><br>Most questions just require finding the right data point. Don't overthink.`},
          {name:'Reading Tables', diff:'easy', expl:`Tables present data in rows and columns. The key is knowing which row and column to look at.<br><br>Strategy:<br>1. Read the column headers and row labels<br>2. Note any footnotes or conditions<br>3. For each question, identify exactly which cell(s) you need<br>4. Watch for patterns: as one variable increases, does another increase or decrease?<br><br>Many table questions are simple lookups. Others ask you to identify trends across multiple rows. Take your time reading the table correctly — speed comes from accuracy, not rushing.`},
          {name:'Interpolation & Extrapolation', diff:'medium', expl:`<strong>Interpolation:</strong> Estimating a value BETWEEN known data points. Usually reliable — just follow the trend.<br><br><strong>Extrapolation:</strong> Predicting a value BEYOND the given data. Less certain — you're extending the trend.<br><br>Example: If a graph shows temperature rising 2° per minute from 20° at 0 min to 30° at 5 min, you can interpolate 26° at 3 min, or extrapolate 40° at 10 min (assuming the trend continues).<br><br>ACT extrapolation questions usually say "if the trend continues…" — just extend the line.`},
          {name:'Identifying Trends & Patterns', diff:'medium', expl:`Look for relationships between variables:<br><br>• <strong>Direct relationship:</strong> as one increases, the other increases<br>• <strong>Inverse relationship:</strong> as one increases, the other decreases<br>• <strong>No relationship:</strong> no clear pattern<br>• <strong>Exponential:</strong> curve gets steeper and steeper<br>• <strong>Plateau:</strong> levels off after a certain point<br><br>Pro tip: Describe the trend in words before looking at the answer choices. Then match your description. This prevents you from being tricked by cleverly-worded wrong answers.`},
        ]
      },
      {
        name: 'Research Summaries',
        topics: [
          {name:'Experimental Design', diff:'medium', expl:`Every experiment has:<br><br>• <strong>Independent variable:</strong> What the scientist deliberately changes<br>• <strong>Dependent variable:</strong> What is measured/observed (the result)<br>• <strong>Control variables:</strong> Everything kept the same<br>• <strong>Control group:</strong> The baseline — receives no treatment or the standard treatment<br><br>Example: Testing if fertilizer helps plants grow. Independent = amount of fertilizer. Dependent = plant height. Controls = same water, light, soil. Control group = plants with no fertilizer.<br><br>Most Research Summary questions hinge on understanding this setup.`},
          {name:'Comparing Experiments', diff:'medium', expl:`Often you'll see Experiment 1, Experiment 2, Experiment 3 — similar but with one key difference.<br><br>Ask yourself: What changed between experiments? That changed variable is what the scientist is testing.<br><br>Questions may ask:<br>• Why was Experiment 2 done? (to test a different variable or confirm results)<br>• How would results change if we modified a variable?<br>• What conclusion is consistent with BOTH experiments?<br><br>Make a quick mental table: what was the same, what was different, and what was the result?`},
          {name:'Hypothesis Support', diff:'hard', expl:`A hypothesis is a proposed explanation. The results either support it or don't.<br><br>Key question types:<br>• "Do the results support the hypothesis?" → Yes if data matches prediction, No if it contradicts<br>• "Which hypothesis is supported by the data?" → Compare each hypothesis against results<br>• "What would support the hypothesis?" → Predict what data WOULD look like if the hypothesis were true<br><br>Be objective. Don't let what "sounds right" override what the data actually shows. The data is always right on the ACT.`},
        ]
      },
      {
        name: 'Conflicting Viewpoints',
        topics: [
          {name:'Understanding Multiple Hypotheses', diff:'hard', expl:`This passage type presents 2-4 different explanations for the same phenomenon (e.g., why did the dinosaurs go extinct?).<br><br>Strategy:<br>1. Read the phenomenon description first<br>2. Read Scientist 1's view and note: what do they believe? WHY?<br>3. Read Scientist 2's view. Note: where do they AGREE with Scientist 1? Where do they DISAGREE?<br>4. Repeat for any additional viewpoints<br><br>Make a quick T-chart on scratch paper: points of agreement vs. disagreement.<br><br>These are the most time-consuming questions. Some students save this passage for last.`},
          {name:'Identifying Agreement & Disagreement', diff:'medium', expl:`These questions ask explicitly: "Scientist 1 and Scientist 2 would most likely agree/disagree on which point?"<br><br>For AGREEMENT: Both must say it or clearly imply it. If one doesn't mention it, they might not disagree — but you can't say they agree.<br><br>For DISAGREEMENT: One must say (or imply) yes, the other no. If both are silent on a topic, there's no demonstrated disagreement.<br><br>Stick to what's actually stated. Don't infer beliefs beyond what each viewpoint explicitly says.`},
          {name:'New Evidence Questions', diff:'hard', expl:`"Which viewpoint would be most weakened/supported by this new evidence?"<br><br>Approach:<br>1. Understand what the new evidence shows<br>2. Check each viewpoint: does this evidence support or undermine their position?<br>3. If evidence contradicts what a viewpoint predicts → weakened<br>4. If evidence matches what a viewpoint predicts → strengthened<br><br>Example: If Scientist 1 says the event was fast and Scientist 2 says it was slow, and new evidence shows it happened in under 100 years, Scientist 1 is strengthened and Scientist 2 is weakened.`},
        ]
      },
      {
        name: 'Background Knowledge — Biology',
        topics: [
          {name:'Cell Structure', diff:'easy', expl:`You may need basic knowledge:<br>• <strong>Nucleus:</strong> contains DNA, controls the cell<br>• <strong>Mitochondria:</strong> produces energy (ATP) through cellular respiration<br>• <strong>Ribosomes:</strong> make proteins<br>• <strong>Cell membrane:</strong> controls what enters and exits<br>• <strong>Chloroplasts:</strong> in plant cells only — photosynthesis<br><br>The passage usually provides context, but knowing organelles helps you read faster.`},
          {name:'DNA, Genes & Proteins', diff:'medium', expl:`Basic facts that help on the ACT:<br>• DNA is the genetic blueprint<br>• DNA → RNA → Protein (Central Dogma)<br>• Genes are segments of DNA that code for proteins<br>• Mutations are changes in DNA sequence — they can be harmful, neutral, or beneficial<br>• <strong>Natural selection:</strong> organisms with advantageous traits survive and reproduce more<br><br>The ACT won't ask you to transcribe DNA to RNA cold, but passages may describe gene expression experiments.`},
          {name:'Ecology & Ecosystems', diff:'easy', expl:`• <strong>Food chains:</strong> producers → primary consumers → secondary consumers → decomposers<br>• <strong>Predator-prey:</strong> cycles — as prey increase, predators increase (with a lag), then prey decrease, predators decrease…<br>• <strong>Carrying capacity:</strong> maximum population an ecosystem can sustain<br>• <strong>Symbiosis:</strong> mutualism (both benefit), parasitism (one benefits, one harmed), commensalism (one benefits, one unaffected)<br><br>Common graph: population vs. time showing cyclical patterns.`},
        ]
      },
      {
        name: 'Background Knowledge — Chemistry',
        topics: [
          {name:'States of Matter', diff:'easy', expl:`• <strong>Solid:</strong> fixed shape & volume, particles packed tightly<br>• <strong>Liquid:</strong> fixed volume, takes shape of container<br>• <strong>Gas:</strong> no fixed shape or volume, particles spread out<br><br>Phase changes:<br>Melting (solid→liquid), Freezing (liquid→solid)<br>Vaporization/Boiling (liquid→gas), Condensation (gas→liquid)<br>Sublimation (solid→gas, like dry ice)<br><br>Water freezes at 0°C and boils at 100°C. These specific values are worth memorizing.`},
          {name:'pH Scale', diff:'easy', expl:`<strong>pH 0-6:</strong> Acidic (more H⁺ ions) — lemon juice, stomach acid<br><strong>pH 7:</strong> Neutral — pure water<br><strong>pH 8-14:</strong> Basic/alkaline (more OH⁻ ions) — baking soda, bleach<br><br>Each pH unit is a 10× change in acidity. pH 3 is 10× more acidic than pH 4, and 100× more acidic than pH 5.<br><br>The ACT may test this in a passage about enzyme activity or water quality.`},
          {name:'Reaction Rates', diff:'medium', expl:`Reactions speed up when:<br>• <strong>Temperature increases</strong> (particles move faster, collide more)<br>• <strong>Concentration increases</strong> (more particles to collide)<br>• <strong>Surface area increases</strong> (more exposed to react)<br>• <strong>Catalysts are added</strong> (lower activation energy without being consumed)<br><br>Enzymes are biological catalysts. They're specific to their substrate (lock and key model).<br><br>These concepts appear frequently in Research Summary passages about chemical or biological experiments.`},
        ]
      },
      {
        name: 'Background Knowledge — Physics',
        topics: [
          {name:'Density & Buoyancy', diff:'easy', expl:`<strong>Density = Mass / Volume</strong><br><br>An object floats if its density is LESS than the fluid it's in. An object sinks if it's MORE dense.<br><br>Water density = 1 g/cm³. Objects with density < 1 float, > 1 sink.<br><br>This explains why ice floats (density ~0.92) and why hot air rises (heated air expands, becomes less dense).<br><br>The ACT loves density questions in science passages — they're really just math questions in disguise.`},
          {name:'Energy', diff:'medium', expl:`• <strong>Kinetic energy:</strong> energy of motion. KE = ½mv² (increases with mass and especially speed!)<br>• <strong>Potential energy:</strong> stored energy. Gravitational PE = mgh (mass × gravity × height)<br>• <strong>Conservation of energy:</strong> energy cannot be created or destroyed, only transformed (KE ↔ PE)<br><br>Example: A roller coaster at the top has max PE. As it drops, PE converts to KE. At the bottom, KE is max and PE is min.<br><br>Heat is energy transfer from hot to cold.`},
          {name:'Forces & Motion', diff:'medium', expl:`<strong>Newton's Laws:</strong><br>1st: Object at rest stays at rest; object in motion stays in motion (unless a force acts).<br>2nd: <code>F = ma</code> (Force = mass × acceleration)<br>3rd: Every action has an equal and opposite reaction.<br><br><strong>Gravity:</strong> pulls objects toward Earth at <code>g ≈ 9.8 m/s²</code>. All objects fall at the same rate (ignoring air resistance).<br><br><strong>Friction:</strong> opposes motion. Static friction (object at rest) > kinetic friction (object moving).`},
        ]
      },
      {
        name: 'Background Knowledge — Earth & Space',
        topics: [
          {name:'Plate Tectonics', diff:'easy', expl:`Earth's crust is divided into plates that move.<br><br>• <strong>Convergent boundaries:</strong> plates collide → mountains, volcanoes, trenches<br>• <strong>Divergent boundaries:</strong> plates separate → new crust forms, mid-ocean ridges<br>• <strong>Transform boundaries:</strong> plates slide past each other → earthquakes<br><br>Fossils of the same species on different continents support continental drift. This is a classic ACT Conflicting Viewpoints topic — the passage may present different theories about what causes plate motion.`},
          {name:'Greenhouse Effect', diff:'medium', expl:`Greenhouse gases (CO₂, methane, water vapor) trap heat in Earth's atmosphere.<br><br>• Sunlight passes through the atmosphere and warms the Earth<br>• Earth radiates heat back as infrared<br>• Greenhouse gases absorb some of this infrared, keeping the planet warm<br>• More greenhouse gases = more heat trapped = global warming<br><br>This topic appears in Data Representation and Conflicting Viewpoints passages. Be prepared to interpret graphs of CO₂ vs. temperature over time.`},
          {name:'The Solar System', diff:'easy', expl:`• Planets orbit the Sun in elliptical (nearly circular) paths<br>• Inner planets (Mercury, Venus, Earth, Mars): rocky, small<br>• Outer planets (Jupiter, Saturn, Uranus, Neptune): gas giants, large<br>• <strong>Gravity</strong> keeps planets in orbit — stronger when closer to the Sun<br>• The Moon orbits Earth; its gravity causes tides<br><br>ACT passages may describe discoveries about exoplanets or compare planetary atmospheres. The science is explained in the passage — just read carefully.`},
        ]
      },
    ]
  }
};

let currentView = 'home';
let currentCategory = null;
let currentTopic = null;
let currentSection = null;
const main = document.getElementById('mainContent');
const searchInput = document.getElementById('searchInput');
const navButtons = document.querySelectorAll('.topbar nav button');
function navigate(view, section, category, topic) {
  currentView = view;
  currentSection = section;
  currentCategory = category;
  currentTopic = topic;
  searchInput.value = '';
  navButtons.forEach(b => b.classList.remove('active'));
  const activeBtn = document.querySelector(`[data-view="${view === 'home' ? 'home' : section}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  render();
  window.scrollTo(0,0);
}
function render() {
  if (currentTopic) return renderTopicDetail();
  if (currentCategory) return renderTopicList();
  if (currentView === 'section') return renderCategoryGrid();
  return renderHome();
}
// ── HOME ──────────────────────
function renderHome() {
  main.innerHTML = `
    <div class="hero-section">
      <h1>Free ACT Revision — Topic by Topic</h1>
      <p>Master every topic on the ACT with clear explanations and video lessons. Choose a subject to get started.</p>
    </div>
    <div class="subject-grid">
      <div class="subject-card math" onclick="navigate('section','math')">
        <span class="icon">📐</span>
        <h3>Math</h3>
        <p>45 questions · 50 min · Pre-Algebra through Trigonometry · ${countTopics('math')} topics</p>
      </div>
      <div class="subject-card english" onclick="navigate('section','english')">
        <span class="icon">📝</span>
        <h3>English</h3>
        <p>50 questions · 35 min · Grammar, usage & rhetoric · ${countTopics('english')} topics</p>
      </div>
      <div class="subject-card reading" onclick="navigate('section','reading')">
        <span class="icon">📖</span>
        <h3>Reading</h3>

    <div class="breadcrumb">
      <button onclick="navigate('home')">← Home</button>
      <span>/</span>

      ${topic.khan ? `<a href="${topic.khan}" target="_blank" rel="noopener" class="yt-btn" style="background:#28a6b5">📚 Khan Academy Lesson</a>` : ''}

// ── SEARCH ────────────────────
function doSearch() {
  const q = searchInput.value.toLowerCase().trim();
  if (!q) {
    // Restore current view
    if (currentTopic !== null) navigate('section', currentSection, currentCategory, currentTopic);
    else if (currentCategory !== null) navigate('section', currentSection, currentCategory);
    else if (currentSection) navigate('section', currentSection);
    else navigate('home');
    return;
  }
  // Search all topics across all sections
  let results = [];
  for (const [sectionKey, sectionData] of Object.entries(data)) {
    sectionData.categories.forEach((cat, ci) => {
      cat.topics.forEach((t, ti) => {
        const haystack = `${t.name} ${cat.name} ${sectionData.title}`.toLowerCase();
        if (haystack.includes(q)) {
          results.push({ section: sectionKey, sectionTitle: sectionData.title, catIdx: ci, catName: cat.name, topicIdx: ti, topic: t });
        }
      });
    });
  }
  if (results.length === 0) {
    main.innerHTML = `<div class="no-results"><h3>😕 No topics found for "<em>${q}</em>"</h3><p>Try a different search term like "slope," "commas," or "probability."</p></div>`;
    return;
  }
  let html = `
    <div class="breadcrumb">
      <button onclick="navigate('home')">← Home</button>
      <span>/</span>
      <strong>Search: "${q}"</strong>
    </div>
    <div class="section-header">
      <h2>Search Results</h2>
      <p>${results.length} topic${results.length>1?'s':''} found</p>
    </div>
    <div class="topic-list">
  `;
  results.forEach(r => {
    const diffClass = r.topic.diff === 'easy' ? 'easy' : r.topic.diff === 'medium' ? 'medium' : 'hard';
    html += `
      <div class="topic-row" onclick="navigate('section','${r.section}',${r.catIdx},${r.topicIdx})">
        <span class="tname">${highlight(r.topic.name, q)} <span style="color:var(--text2);font-weight:400;font-size:.82rem">— ${r.sectionTitle} · ${r.catName}</span></span>
        <div class="tmeta">
          <span class="difficulty ${diffClass}">${r.topic.diff}</span>
          <span style="color:var(--text2);font-size:.8rem">→</span>
        </div>
      </div>
    `;
  });
  html += '</div>';
  main.innerHTML = html;
}
function highlight(text, query) {
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}
function countTopics(section) {
  return data[section].categories.reduce((sum, c) => sum + c.topics.length, 0);
}
// ── NAV CLICKS ────────────────
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    if (view === 'home') navigate('home');
    else navigate('section', view);
  });
});
// ── INIT ──────────────────────
navigate('home');
</script>
